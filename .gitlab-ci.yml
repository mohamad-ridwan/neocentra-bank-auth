stages:
  - test
  - build
  - deploy

variables:
  REGISTRY_IMAGE: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

run_tests:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint || echo "Lint warnings allowed"
    - npm run test -- --run
  only:
    - merge_requests
    - main

build_image:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    
    # Menyiapkan struktur direktori workspace agar sesuai dengan ekspektasi Dockerfile (root context build)
    - mkdir -p ../workspace/neocentra-bank-auth
    # Salin isi repositori saat ini ke folder neocentra-bank-auth
    - cp -r * ../workspace/neocentra-bank-auth/
    - cp -r .* ../workspace/neocentra-bank-auth/ 2>/dev/null || true
    
    # Kloning dependensi neocentra-bank-shared di tingkat yang sama
    - |
      if [ -n "$GITHUB_PAT" ]; then
        git clone https://x-access-token:${GITHUB_PAT}@github.com/mohamad-ridwan/neocentra-bank-shared.git ../workspace/neocentra-bank-shared
      else
        git clone https://github.com/mohamad-ridwan/neocentra-bank-shared.git ../workspace/neocentra-bank-shared
      fi
      
    # Jalankan docker build dengan context parent (../workspace)
    - docker build 
      --cache-from $REGISTRY_IMAGE:latest 
      -t $REGISTRY_IMAGE:$IMAGE_TAG 
      -t $REGISTRY_IMAGE:latest 
      -f ../workspace/neocentra-bank-auth/Dockerfile ../workspace
      
    - docker push $REGISTRY_IMAGE:$IMAGE_TAG
    - docker push $REGISTRY_IMAGE:latest
  only:
    - main
    - feature/login

deploy_local_k8s:
  stage: deploy
  image: bitnami/kubectl:1.27
  script:
    - mkdir -p ~/.kube
    - cp "$KUBECONFIG" ~/.kube/config
    - kubectl set image deployment/neocentra-mfe-auth auth-mfe=$REGISTRY_IMAGE:$IMAGE_TAG --record
    - kubectl rollout status deployment/neocentra-mfe-auth
  only:
    - main
    - feature/login
